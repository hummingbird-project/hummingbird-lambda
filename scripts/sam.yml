AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: A sample SAM template for deploying Hummingbird Lambda functions.

Globals:
    Function:
        Timeout: 3
        MemorySize: 128

Resources:
    hbLambdaTestFunction:
        Type: AWS::Serverless::Function
        Properties:
            Handler: swift.bootstrap
            Runtime: provided.al2023
            Architectures:
                - arm64
            CodeUri: ../.build/plugins/AWSLambdaBuilder/outputs/AWSLambdaBuilder/HBLambdaTest/HBLambdaTest.zip
            Environment:
                Variables:
                    # by default, AWS Lambda runtime produces no log
                    # use `LOG_LEVEL: debug` for for lifecycle and event handling information
                    # use `LOG_LEVEL: trace` for detailed input event information
                    LOG_LEVEL: trace
            # Instructs new versions to be published to an alias named "live".
            AutoPublishAlias: live
            Events:
                Add:
                    Type: Api
                    Properties:
                        Path: /add
                        Method: post
                Subtract:
                    Type: Api
                    Properties:
                        Path: /subtract
                        Method: post
                Multiply:
                    Type: Api
                    Properties:
                        Path: /multiply
                        Method: post
                Divide:
                    Type: Api
                    Properties:
                        Path: /divide
                        Method: post

Outputs:
    AddFunctionApi:
        Description: "API Gateway endpoint URL for Prod stage for Add function"
        Value: !Sub "https://${hbLambdaTestFunction}.execute-api.${AWS::Region}.amazonaws.com/add"
    SubtractFunctionApi:
        Description: "API Gateway endpoint URL for Prod stage for Subtract function"
        Value: !Sub "https://${hbLambdaTestFunction}.execute-api.${AWS::Region}.amazonaws.com/subtract"
    MulitplyFunctionApi:
        Description: "API Gateway endpoint URL for Prod stage for Multiply function"
        Value: !Sub "https://${hbLambdaTestFunction}.execute-api.${AWS::Region}.amazonaws.com/multiply"
    DivideFunctionApi:
        Description: "API Gateway endpoint URL for Prod stage for Divide function"
        Value: !Sub "https://${hbLambdaTestFunction}.execute-api.${AWS::Region}.amazonaws.com/divide"
