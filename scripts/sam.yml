AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: A sample SAM template for deploying Hummingbird Lambda functions.

Globals:
    Function:
        Timeout: 3
        MemorySize: 128

Resources:
    hbLambdaTestFunction:
        Type: AWS::Serverless::Function
        Properties:
            FunctionName: "hb-lambda-test"
            Handler: swift.bootstrap
            Runtime: provided.al2023
            Architectures:
                - arm64
            CodeUri: ../.build/plugins/AWSLambdaBuilder/outputs/AWSLambdaBuilder/HBLambdaTest/HBLambdaTest.zip
            Environment:
                Variables:
                    # by default, AWS Lambda runtime produces no log
                    # use `LOG_LEVEL: debug` for for lifecycle and event handling information
                    # use `LOG_LEVEL: trace` for detailed input event information
                    LOG_LEVEL: trace
            # Instructs new versions to be published to an alias named "live".
            FunctionUrlConfig:
                AuthType: NONE
                InvokeMode: BUFFERED

Outputs:
    hbLambdaTestFunctionEndpoint:
        Description: "My Lambda Function URL Endpoint"
        Value: !GetAtt hbLambdaTestFunctionUrl.FunctionUrl